
services:
  hadoop:
    build:
      context: .
      dockerfile: hadoop/Dockerfile
    container_name: examen-hadoop
    hostname: hadoop
    networks:
      - examen-red
    volumes:
      - hadoop_data:/tmp/examen
      - ./ventas_125054548.csv:/tmp/examen/ventas.csv:ro
      - ./mapreduce/mapper.py:/tmp/examen/mapper.py:ro
      - ./mapreduce/reducer.py:/tmp/examen/reducer.py:ro
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: examen-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examen-red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: examen-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    volumes:
      - hadoop_data:/tmp/examen:ro
    networks:
      - examen-red
    restart: unless-stopped

networks:
  examen-red:
    driver: bridge

volumes:
  postgres_data:
  hadoop_data: